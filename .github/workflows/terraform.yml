name: "Terraform GitOps"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Verhindert, dass mehrere Runs für dieselbe Pipeline parallel laufen und den State zerstören
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Schnelle, parallele Checks
  format:
    name: "Check: Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  security:
    name: "Check: Security"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Tfsec (Security Scan)
        uses: aquasecurity/tfsec-pr-commenter-action@v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
# NEUER JOB: Automatische Dokumentation
  readme-docs:
    name: "Docs: Auto-Generate README"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, damit der Runner die README im Repo aktualisieren darf
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Holt den echten Branch-Verlauf, um Merge-Konflikte beim Push zu vermeiden
          ref: ${{ github.head_ref }}

      # Generiert die Terraform-Tabellen automatisch
      - name: Render terraform-docs inside README
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          working-dir: environments/test
          output-file: README.md
          output-method: inject
          git-push: "true" # Pusht die aktualisierte README direkt wieder in deinen Branch!
          git-commit-message: "docs: auto-update terraform block in README.md [skip ci]"
  # 2. Validierung & Plan-Generierung
  plan:
    name: "Terraform: Plan"
    runs-on: ubuntu-latest
    needs: [format, security]
    permissions:
      pull-requests: write
      contents: read
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: |
          cd environments/test
          terraform init

      - name: Terraform Validate
        run: |
          cd environments/test
          terraform validate

      # Wir generieren den Plan und speichern ihn binär in einer Datei ab
      - name: Terraform Plan
        id: plan
        run: |
          cd environments/test
          terraform plan -detailed-exitcode -no-color -out=tfplan > plan_output.txt
        continue-on-error: true # Verhindert den Abbruch, damit wir den Kommentar posten können

      # Der Plan-Kommentar im PR
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/test/plan_output.txt', 'utf8');
            const output = `#### Terraform Plan Status: 📝
            
            \`\`\`terraform
            ${plan}
            \`\`\`
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Verhindert den PR-Merge, falls der Plan fehlgeschlagen ist
      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # TOP-NOTCH FEATURE: Wir sichern das Plan-Artefakt für das spätere Apply
      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: environments/test/tfplan
          retention-days: 2

  # 3. Das absolut sichere Apply
  apply:
    name: "Terraform: Apply"
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    # TOP-NOTCH FEATURE: Bindung an ein GitHub Environment mit "Manual Approval"
    environment:
      name: production
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # Wir holen uns exakt den im PR generierten Plan wieder ab!
      - name: Download Plan Artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: tfplan
          path: environments/test/
          # Holt das Artefakt aus dem letzten erfolgreichen Run des PRs, der in main gemergt wurde
          workflow: terraform.yml
          run_id: ${{ github.event.workflow_run.id }} # Falls durch Workflow_run getriggert
          # Fallback: Sucht nach dem letzten erfolgreichen Artefakt dieses Namens im Repo
          search_artifacts: true

      - name: Terraform Init
        run: |
          cd environments/test
          terraform init

      # Da wir die 'tfplan'-Datei nutzen, wird exakt der Code deployt, den du im PR abgesegnet hast!
      - name: Terraform Apply
        run: |
          cd environments/test
          terraform apply -auto-approve tfplan