name: "Terraform GitOps Simulation"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  terraform-checks:
    name: "Lokal Checks & Validierung"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # --- CHECK 1: FORMATIERUNG (Hält den Code sauber) ---
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      # Falls jemand unformatierten Code pusht, bricht die Pipeline hier ab.

    # --- CHECK 2: SECURITY SCAN (Sucht nach Schwachstellen) ---
    - name: Run Tfsec (Security Scan)
      uses: aquasecurity/tfsec-pr-commenter-action@v1.2.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
      # Findet z.B. unverschlüsselte Buckets oder offene Ports und kommentiert direkt im PR.

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7

    - name: Terraform Init
      run: |
        cd environments/test
        terraform init -backend=false
        # '-backend=false' erlaubt das Validieren völlig ohne echtes Backend/S3-Verbindung

    # --- CHECK 3: SYNTAX & LOGIK (Prüft Variablen & Provider) ---
    - name: Terraform Validate
      run: |
        cd environments/test
        terraform validate

    # --- SCHRITT 4: PLAN (Läuft nur im PR) ---
    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      id: plan
      run: |
        cd environments/test
        terraform plan -no-color -out=tfplan > plan_output.txt
      continue-on-error: true

    - name: Post Plan to PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const plan = fs.readFileSync('environments/test/plan_output.txt', 'utf8');
          const output = `#### Terraform Plan Status: 📝
          
          \`\`\`terraform
          ${plan}
          \`\`\`
          
          *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    # --- SCHRITT 5: APPLY (Läuft nur beim Merge auf main) ---
    - name: Terraform Apply
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cd environments/test
        terraform apply -auto-approve