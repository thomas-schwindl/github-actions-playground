name: "Terraform GitOps Simulation"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # JOB 1: Formatierung prüfen (Schnell & parallel)
  format:
    name: "Check: Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  # JOB 2: Security Scannen (Schnell & parallel)
  security:
    name: "Check: Security"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tfsec (Security Scan)
        uses: aquasecurity/tfsec-pr-commenter-action@v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # JOB 3: Validierung (Wartet auf Format & Security)
  validate:
    name: "Check: Validate"
    runs-on: ubuntu-latest
    needs: [format, security] # Startet erst, wenn Format & Security grün sind!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: |
          cd environments/test
          terraform init

      - name: Terraform Validate
        run: |
          cd environments/test
          terraform validate

  # JOB 4: Plan oder Apply ausführen (Wartet auf erfolgreiche Validierung)
  deploy:
    name: "Terraform: Run"
    runs-on: ubuntu-latest
    needs: validate # Startet erst, wenn die Validierung erfolgreich war!
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: |
          cd environments/test
          terraform init

      # PLAN-SCHRITT (Nur im PR)
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        id: plan
        run: |
          cd environments/test
          terraform plan -no-color -out=tfplan > plan_output.txt
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/test/plan_output.txt', 'utf8');
            const output = `#### Terraform Plan Status: 📝
            
            \`\`\`terraform
            ${plan}
            \`\`\`
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # APPLY-SCHRITT (Nur beim Merge auf main)
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd environments/test
          terraform apply -auto-approve